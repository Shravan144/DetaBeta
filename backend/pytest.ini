# Pytest configuration for the DetaBeta backend.
#
# All of our tests are plain functions named test_*, so we tell pytest NOT to
# hunt for test *classes*. This also stops it from mistaking domain enums like
# `TestKind` (Engine 4) for test classes just because the name starts with "Test".
[pytest]
python_files = test_*.py
python_functions = test_*
python_classes =
